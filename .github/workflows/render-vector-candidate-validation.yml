name: Render vector candidate validation image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render-vector-candidate-validation.yml"
      - "docs/agents/assets/AGENT_MENTAL_MODEL_v0.2_source_candidate_v0.3.svg"
      - "docs/agents/assets/AGENT_MENTAL_MODEL_v0.2_master_2048x1364.png"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inkscape and ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape imagemagick

      - name: Render SVG candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/agents/validation/images
          inkscape docs/agents/assets/AGENT_MENTAL_MODEL_v0.2_source_candidate_v0.3.svg --export-type=png --export-filename=docs/agents/validation/images/AGENT_MENTAL_MODEL_v0.2_source_candidate_v0.3_render.png --export-width=2048 --export-height=1364
          test -s docs/agents/validation/images/AGENT_MENTAL_MODEL_v0.2_source_candidate_v0.3_render.png

      - name: Verify dimensions
        shell: bash
        run: |
          set -euo pipefail
          actual="$(identify -format '%wx%h' docs/agents/validation/images/AGENT_MENTAL_MODEL_v0.2_source_candidate_v0.3_render.png)"
          echo "render dimensions: $actual"
          test "$actual" = "2048x1364"

      - name: Commit render
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/validation/images/AGENT_MENTAL_MODEL_v0.2_source_candidate_v0.3_render.png

          if git diff --cached --quiet; then
            echo "Validation render already current."
            exit 0
          fi

          git commit -m "docs: add v0.3 vector candidate validation render"
          git push
