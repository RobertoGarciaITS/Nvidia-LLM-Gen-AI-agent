name: Build legacy v0.1 agent mental model raster renditions

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/convert-agent-mental-model-png.yml"
      - "docs/agents/assets/AGENT_MENTAL_MODEL_v0.1.webp"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

      - name: Render v0.1 raster profiles
        shell: bash
        run: |
          set -euo pipefail

          src="docs/agents/assets/AGENT_MENTAL_MODEL_v0.1.webp"
          preview="docs/agents/assets/AGENT_MENTAL_MODEL_v0.1.png"
          doc="docs/agents/assets/AGENT_MENTAL_MODEL_v0.1_doc_1024x682.png"
          master="docs/agents/assets/AGENT_MENTAL_MODEL_v0.1_master_2048x1364.png"

          if command -v magick >/dev/null 2>&1; then
            magick "$src" "$preview"
            magick "$src" -filter Lanczos -resize 1024x682 "$doc"
            magick "$src" -filter Lanczos -resize 2048x1364 "$master"
          else
            convert "$src" "$preview"
            convert "$src" -filter Lanczos -resize 1024x682 "$doc"
            convert "$src" -filter Lanczos -resize 2048x1364 "$master"
          fi

          test "$(identify -format '%wx%h' "$preview")" = "512x341"
          test "$(identify -format '%wx%h' "$doc")" = "1024x682"
          test "$(identify -format '%wx%h' "$master")" = "2048x1364"

      - name: Commit v0.1 renditions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             docs/agents/assets/AGENT_MENTAL_MODEL_v0.1.png             docs/agents/assets/AGENT_MENTAL_MODEL_v0.1_doc_1024x682.png             docs/agents/assets/AGENT_MENTAL_MODEL_v0.1_master_2048x1364.png

          if git diff --cached --quiet; then
            echo "V0.1 renditions are already current."
            exit 0
          fi

          git commit -m "docs: refresh legacy v0.1 raster renditions"
          git push
