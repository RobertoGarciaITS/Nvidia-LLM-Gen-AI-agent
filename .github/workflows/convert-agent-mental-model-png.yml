name: Build agent mental model raster renditions

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/convert-agent-mental-model-png.yml"
      - "docs/agents/assets/AGENT_MENTAL_MODEL_v0.1.webp"
      - "docs/agents/assets/AGENT_MENTAL_MODEL_v0.2.webp"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

      - name: Render canonical PNG profiles
        shell: bash
        run: |
          set -euo pipefail

          render() {
            local src="$1"
            local dst="$2"
            shift 2

            if command -v magick >/dev/null 2>&1; then
              magick "$src" "$@" "$dst"
            else
              convert "$src" "$@" "$dst"
            fi
          }

          for version in v0.1 v0.2; do
            src="docs/agents/assets/AGENT_MENTAL_MODEL_${version}.webp"
            preview="docs/agents/assets/AGENT_MENTAL_MODEL_${version}.png"
            doc="docs/agents/assets/AGENT_MENTAL_MODEL_${version}_doc_1024x682.png"
            master="docs/agents/assets/AGENT_MENTAL_MODEL_${version}_master_2048x1364.png"

            test -f "$src"

            # Preview: direct format conversion at the canonical 512 x 341 raster baseline.
            render "$src" "$preview"

            # Documentation and master: deterministic raster scaling.
            # Lanczos is explicit and reproducible; no crop, generative fill or semantic edit.
            render "$src" "$doc" -filter Lanczos -resize 1024x682
            render "$src" "$master" -filter Lanczos -resize 2048x1364

            test -s "$preview"
            test -s "$doc"
            test -s "$master"
          done

      - name: Verify exact dimensions
        shell: bash
        run: |
          set -euo pipefail

          assert_dimensions() {
            local file="$1"
            local expected="$2"
            local actual
            actual="$(identify -format '%wx%h' "$file")"
            echo "$file -> $actual"
            test "$actual" = "$expected"
          }

          for version in v0.1 v0.2; do
            assert_dimensions "docs/agents/assets/AGENT_MENTAL_MODEL_${version}.png" "512x341"
            assert_dimensions "docs/agents/assets/AGENT_MENTAL_MODEL_${version}_doc_1024x682.png" "1024x682"
            assert_dimensions "docs/agents/assets/AGENT_MENTAL_MODEL_${version}_master_2048x1364.png" "2048x1364"
          done

      - name: Commit raster renditions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             docs/agents/assets/AGENT_MENTAL_MODEL_v0.1.png             docs/agents/assets/AGENT_MENTAL_MODEL_v0.1_doc_1024x682.png             docs/agents/assets/AGENT_MENTAL_MODEL_v0.1_master_2048x1364.png             docs/agents/assets/AGENT_MENTAL_MODEL_v0.2.png             docs/agents/assets/AGENT_MENTAL_MODEL_v0.2_doc_1024x682.png             docs/agents/assets/AGENT_MENTAL_MODEL_v0.2_master_2048x1364.png

          if git diff --cached --quiet; then
            echo "Raster renditions are already current."
            exit 0
          fi

          git commit -m "docs: generate documented and master PNG renditions"
          git push
